<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
    }

    .login-box {
      width: min(90%, 360px);
      padding: 30px;
      background: #1d1d1d;
      border-radius: 12px;
      box-sizing: border-box;
    }

    h1 {
      margin-top: 0;
      text-align: center;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin: 8px 0;
      border-radius: 6px;
      border: 1px solid #555;
      background: #222;
      color: white;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 12px;
      border: 0;
      border-radius: 6px;
      cursor: pointer;
    }

    .error {
      color: #ff7777;
      text-align: center;
      margin-top: 12px;
    }
  </style>
</head>

<body>
  <div class="login-box">
    <h1>Admin Login</h1>

    <form method="POST" action="/admin-login.html" autocomplete="off">
      <input
        type="text"
        name="username"
        placeholder="Username"
        autocomplete="username"
        required
      >

      <input
        type="password"
        name="password"
        placeholder="Password"
        autocomplete="current-password"
        required
      >

      <button type="submit">Log In</button>
    </form>

    <div class="error" id="error"></div>
  </div>
</body>
</html>
